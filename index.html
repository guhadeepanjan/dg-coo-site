<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>deepanjanguha.work</title>
<meta name="description" content="This is a private website. Access is by invitation only.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#163300; --green:#9fe870; --green-dark:#2ead4b; --tint:#f2f5f0;
  --card:#ffffff; --muted:#5d7079; --line:#e3eae0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--tint);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 8px 30px rgba(22,51,0,.05);max-width:520px;width:100%;padding:48px 40px;text-align:center}
.mark{width:14px;height:14px;border-radius:4px;background:var(--green);margin:0 auto 22px}
h1{font-size:clamp(26px,5vw,34px);font-weight:900;letter-spacing:-.025em;line-height:1.15}
p{margin-top:14px;font-size:16.5px;color:#33413a}
.domain{margin-top:30px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>This is a private website.</h1>
    <p>Access is by invitation only.</p>
    <div class="domain">deepanjanguha.work</div>
  </main>
</body>
</html>
