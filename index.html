var STORE_KEY = 'dgw_invite_code';
function b64(s){var bin=atob(s);var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++){u[i]=bin.charCodeAt(i);}return u;}
async function tryUnlock(code){
  var enc=new TextEncoder();
  var baseKey=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(VAULT.salt),iterations:VAULT.iter,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(VAULT.iv)},key,b64(VAULT.data));
  return new TextDecoder().decode(plain);
}
function showHome(html){
  document.open();document.write(html);document.close();
}
var form=document.getElementById('gateForm');
var input=document.getElementById('code');
var btn=document.getElementById('unlockBtn');
var err=document.getElementById('err');
var busy=document.getElementById('busy');
form.addEventListener('submit',async function(e){
  e.preventDefault();
  var code=input.value.trim();
  if(!code){return;}
  err.style.display='none';busy.style.display='block';btn.disabled=true;
  try{
    var html=await tryUnlock(code);
    try{localStorage.setItem(STORE_KEY,code);}catch(_){}
    showHome(html);
  }catch(_){
    busy.style.display='none';err.style.display='block';btn.disabled=false;input.select();
  }
});
(function(){
  var saved=null;
  try{saved=localStorage.getItem(STORE_KEY);}catch(_){}
  if(saved){
    busy.style.display='block';btn.disabled=true;input.disabled=true;
    tryUnlock(saved).then(function(html){showHome(html);}).catch(function(){
      try{localStorage.removeItem(STORE_KEY);}catch(_){}
      busy.style.display='none';btn.disabled=false;input.disabled=false;
    });
  }
})();
</script>
